# Not a Python project. This only pins the dev tooling (prek, which runs the
# git hooks) into .venv, the same way the other repos do:
#
#   sfw uv sync
#   .venv/bin/prek install --hook-type pre-commit --hook-type pre-push
[project]
name = "secproxy-dev"
version = "0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "prek==0.4.14",
]

[tool.uv]
package = false
